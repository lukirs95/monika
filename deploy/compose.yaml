# Lokale Entwicklungsumgebung. Start und Stopp über make db-up / make db-down.
name: monika

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: monika
      POSTGRES_PASSWORD: monika
      POSTGRES_DB: monika
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "monika"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  postgres:
