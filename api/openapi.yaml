openapi: 3.0.3
info:
  title: Monika API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    HTTP-API von Monika. Konventionen, Filter und das Abo-Modell stehen in `docs/contracts/api.md`.
    Fehler sind Problem Details (RFC 9457) mit stabilem `code`. Zeitpunkte sind RFC 3339 in UTC,
    IDs UUIDs, Feldnamen snake_case.
servers:
  - url: /api/v1
security:
  - session: []
  - bearer: []
tags:
  - name: auth
    description: Anmeldung, Sitzungen, TOTP, Kiosk
  - name: state
    description: Aktueller Stand, Fakten, Ereignisstrom und Abos
  - name: inventory
    description: Treiber, Geräte, Quellen, Gruppen, Elemente, Mitgliedschaften
  - name: evaluation
    description: Regeln und Befunde
  - name: actions
    description: Aktionen (Läufe) und Presets
  - name: admin
    description: Weiterleitung, Secrets, Benutzer, Rollen, Rechte, Tokens
  - name: self
    description: Eigenes Passwort und eigene Sitzungen
  - name: history
    description: Verlauf mit Cursor-Paginierung (neueste zuerst)

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Erster Schritt der Anmeldung mit Benutzername und Passwort
      description: |
        Liefert immer eine Challenge für den zweiten Schritt; ist TOTP noch nicht eingerichtet,
        ist `needs_enrollment` gesetzt. Fehler sind für „unbekannt“ und „falsches Passwort“ gleich.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Passwort richtig, zweiter Schritt erforderlich
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginStep' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login/totp:
    post:
      tags: [auth]
      operationId: loginTOTP
      summary: Zweiter Schritt mit TOTP-Code oder Wiederherstellungscode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecondFactorRequest' }
      responses:
        '204': { $ref: '#/components/responses/SessionCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/totp/enroll:
    post:
      tags: [auth]
      operationId: enrollTOTP
      summary: TOTP einrichten (bei der ersten Anmeldung erzwungen)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChallengeRequest' }
      responses:
        '200':
          description: Geheimnis als otpauth-URL (QR-Code) und zum Abtippen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/totp/confirm:
    post:
      tags: [auth]
      operationId: confirmTOTP
      summary: Einrichtung mit einem Code aus der App bestätigen; schließt die Anmeldung ab
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecondFactorRequest' }
      responses:
        '200':
          description: Eingerichtet und angemeldet; Wiederherstellungscodes werden nur jetzt angezeigt
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/kiosk:
    post:
      tags: [auth]
      operationId: kioskLogin
      summary: Kiosk-Sitzung für ein Dashboard aus einem Token mit read_only
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KioskRequest' }
      responses:
        '204': { $ref: '#/components/responses/SessionCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sitzung beenden
      security:
        - session: []
      responses:
        '204':
          description: Abgemeldet; das Cookie wird gelöscht
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearSessionCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Der angemeldete Benutzer und seine Rechte
      responses:
        '200':
          description: Angemeldeter Benutzer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /healthz:
    get:
      tags: [state]
      operationId: getHealthz
      summary: Betriebsbereitschaft für Docker-Healthcheck und externe Überwachung (ohne Anmeldung)
      security: []
      responses:
        '200': { description: 'Monika läuft, die Datenbank ist erreichbar' }
        '503': { description: 'Die Datenbank ist nicht erreichbar; Zustandswechsel warten' }

  /state:
    get:
      tags: [state]
      operationId: getState
      summary: Aktueller Stand ohne Fakten, gefiltert nach Rechten
      description: |
        Inventar und Links, Health und Rollups, aktive Befunde, laufende Läufe und der Zustand der
        Quellen. Verschwundene Elemente sind enthalten (`present = false`). Fakten gibt es pro
        Element bzw. per Abo.
      responses:
        '200':
          description: Stand mit Version der View
          content:
            application/json:
              schema: { $ref: '#/components/schemas/State' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /elements/{element_id}/facts:
    get:
      tags: [state]
      operationId: getElementFacts
      summary: Aktuelle Fakten eines Elements
      parameters:
        - $ref: '#/components/parameters/ElementID'
      responses:
        '200':
          description: Fakten mit Version der View
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElementFacts' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events:
    get:
      tags: [state]
      operationId: getEvents
      summary: Ereignisstrom (Server-Sent Events)
      description: |
        Erstes Ereignis ist `hello` mit der `stream_id`. Jedes Ereignis trägt als SSE-`id` die
        Version der View, zu der es den Stand seines Objekts beschreibt; nach einem Abbruch sendet
        der Browser sie als `Last-Event-ID`. Liegt sie im Ringpuffer (letzte 100 Ereignisse ohne
        `facts_changed`), folgen alle Ereignisse ab einschließlich dieser Version daraus (Ereignisse
        sind idempotent); sonst folgt `resync`, und der Client lädt `/state` neu. Danach meldet der
        Client seine Watches neu an. Beim ersten Laden öffnet der Client zuerst den Strom und lädt
        danach `/state`; Ereignisse mit `version` ≤ der Version des Stands verwirft er. `facts_changed` kommt nur
        für beobachtete Elemente (siehe `/events/{stream_id}/watch`). Bei Rückstau fasst der Server
        Ereignisse nach Objekt zusammen; es gilt der neueste Stand (`docs/contracts/api.md`).

        Ereignistypen (SSE `event`) und Nutzdaten (SSE `data`, JSON):
        `hello` → EventHello, `resync` → leer, `elements_changed` → EventElementsChanged,
        `facts_changed` → EventFactsChanged, `health_changed` → EventHealthChanged,
        `finding_raised` / `finding_acked` → Finding, `finding_ended` → EventFindingEnded,
        `finding_cause_changed` → EventFindingCauseChanged, `run_changed` → RunSummary,
        `source_status_changed` → SourceStatus.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Strom von Ereignissen
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /events/{stream_id}/watch:
    post:
      tags: [state]
      operationId: watch
      summary: Beobachtete Geltungsbereiche eines Stroms ändern
      description: |
        Beobachtet werden Geltungsbereiche: Elemente mit Nachfahren, Gruppen mit Mitgliedern und deren
        Nachfahren (wie bei Regeln und Rechten). Die Abos gehören zum
        Strom und enden mit ihm. Die Antwort enthält die aktuellen Fakten aller neu beobachteten
        Elemente. Höchstens 1 000 beobachtete Elemente pro Strom.
      parameters:
        - name: stream_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WatchRequest' }
      responses:
        '200':
          description: Abos geändert; aktuelle Fakten der neu beobachteten Elemente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /drivers:
    get:
      tags: [inventory]
      operationId: listDrivers
      summary: Registrierte Treiber mit Konfigurationsschema und Aktionen
      responses:
        '200':
          description: Treiber
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Driver' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices:
    post:
      tags: [inventory]
      operationId: createDevice
      summary: Gerät anlegen (inventory_edit global)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCreate' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Element' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /devices/{device_id}:
    delete:
      tags: [inventory]
      operationId: deleteDevice
      summary: Gerät löschen (inventory_edit global)
      description: |
        Löscht das Gerät mit seinen Quellen und Elementen, entfernt Mitgliedschaften, löscht Regeln,
        Rechte und Weiterleitungen mit diesem Geltungsbereich, zieht aktive Befunde zurück
        (`deleted`) und stoppt die Quellen. Befunde und Läufe bleiben im Verlauf. Solange ein
        Preset-Schritt auf das Gerät oder eines seiner Elemente zielt: 409 `device_in_use`.
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '204': { description: Gelöscht }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InUse' }

  /devices/{device_id}/sources:
    get:
      tags: [inventory]
      operationId: listSources
      summary: Quellen eines Geräts mit Konfiguration und Identität (view am Gerät)
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '200':
          description: Quellen
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [inventory]
      operationId: createSource
      summary: Quelle anlegen, mit Zugangs-Element (source_edit)
      description: |
        Die Konfiguration wird gegen das Schema des Treibers geprüft. Pro Gerät höchstens eine
        Quelle je Treiber (409 `source_exists`).
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceCreate' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /sources/{source_id}:
    delete:
      tags: [inventory]
      operationId: deleteSource
      summary: Quelle löschen (source_edit)
      description: |
        Stoppt die Quelle und löscht sie mit ihrem Zugangs-Element, ihren Elementen und Links;
        Konfiguration mit Geltungsbereich darin wird mitgelöscht, aktive Befunde werden zurückgezogen
        (`deleted`). Solange ein Preset-Schritt auf eines ihrer Elemente zielt: 409 `source_in_use`.
      parameters:
        - name: source_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Gelöscht }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InUse' }
    put:
      tags: [inventory]
      operationId: updateSource
      summary: Adresse, Konfiguration, Secret und Aktivierung ändern (source_edit)
      description: Die Quelle wird mit der neuen Konfiguration neu gestartet.
      parameters:
        - name: source_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceUpdate' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /groups:
    post:
      tags: [inventory]
      operationId: createGroup
      summary: Gruppe anlegen (inventory_edit global)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Element' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /groups/{group_id}:
    delete:
      tags: [inventory]
      operationId: deleteGroup
      summary: Gruppe löschen (inventory_edit global)
      description: Solange ein Preset-Schritt auf die Gruppe zielt, 409 `group_in_use`.
      parameters:
        - $ref: '#/components/parameters/GroupID'
      responses:
        '204': { description: Gelöscht }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InUse' }

  /groups/{group_id}/members:
    post:
      tags: [inventory]
      operationId: addGroupMember
      summary: Element in die Gruppe aufnehmen (inventory_edit an Gruppe und Element)
      description: Würde ein Zyklus zwischen Gruppen entstehen, 409 `member_cycle`.
      parameters:
        - $ref: '#/components/parameters/GroupID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipCreate' }
      responses:
        '201':
          description: Aufgenommen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /memberships/{link_id}:
    put:
      tags: [inventory]
      operationId: updateGroupMember
      summary: Position und Label einer Mitgliedschaft ändern (inventory_edit an Gruppe und Element)
      parameters:
        - $ref: '#/components/parameters/LinkID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipUpdate' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [inventory]
      operationId: removeGroupMember
      summary: Mitgliedschaft entfernen (inventory_edit an Gruppe und Element)
      parameters:
        - $ref: '#/components/parameters/LinkID'
      responses:
        '204': { description: Entfernt }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /elements/{element_id}/rules:
    get:
      tags: [evaluation]
      operationId: getElementRules
      summary: Welche Regeln an einem Element gelten und welche sie überschreiben (view am Element)
      description: |
        Pro Fakt und Richtung (`upper`, `lower`, `equality`) die geltenden und die überschriebenen Regeln,
        aus `View.EffectiveRules`. Enthalten sind auch Regeln, deren Geltungsbereich der Benutzer nicht
        sehen darf; von ihnen erscheint nur die Art des Geltungsbereichs, nicht dessen Name.
      parameters:
        - $ref: '#/components/parameters/ElementID'
      responses:
        '200':
          description: Regeln pro Fakt und Richtung
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EffectiveRuleSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /elements/{element_id}/user-fields:
    put:
      tags: [inventory]
      operationId: updateUserFields
      summary: Label, Notizen und Überwachung setzen (inventory_edit am Element)
      description: Ersetzt alle drei Felder; `null` leert Label bzw. Notizen.
      parameters:
        - $ref: '#/components/parameters/ElementID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserFields' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Element' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rules:
    get:
      tags: [evaluation]
      operationId: listRules
      summary: Regeln, deren Geltungsbereich der Benutzer sehen darf (globale für alle)
      responses:
        '200':
          description: Regeln
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [evaluation]
      operationId: createRule
      summary: Regel anlegen (rule_edit am Geltungsbereich, global bei Regeln ohne Geltungsbereich)
      description: Operator und Werttyp werden geprüft (422 `invalid_rule`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /rules/{rule_id}:
    put:
      tags: [evaluation]
      operationId: updateRule
      summary: Regel ändern (rule_edit am alten und am neuen Geltungsbereich)
      description: Deaktivieren zieht ihre aktiven Befunde zurück; inhaltliche Änderungen bewertet der Core neu.
      parameters:
        - $ref: '#/components/parameters/RuleID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleInput' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [evaluation]
      operationId: deleteRule
      summary: Regel löschen (rule_edit am Geltungsbereich); aktive Befunde werden zurückgezogen
      parameters:
        - $ref: '#/components/parameters/RuleID'
      responses:
        '204': { description: Gelöscht }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /findings/{finding_id}/ack:
    post:
      tags: [evaluation]
      operationId: ackFinding
      summary: Aktiven Befund quittieren (acknowledge am Element)
      description: Ändert nicht die Health, nur Anzeige und Meldung. Die erste Quittierung bleibt bestehen.
      parameters:
        - name: finding_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Quittiert }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs:
    post:
      tags: [actions]
      operationId: submitRun
      summary: Aktion ausführen (operate bzw. bei set configure, jeweils + critical, am Ziel)
      description: |
        Asynchron: Die Antwort enthält die ID des Laufs, den Fortgang meldet `run_changed`.
        Ein Element, das die Aktion unterstützt, bekommt sie selbst. Geräte und Gruppen verteilen:
        `device_level = true` an die Zugangs-Elemente (dann ist `driver` Pflicht, 422
        `driver_required`), sonst an alle übrigen Elemente; `driver` filtert nach Quelle. Bei `set`
        werden Elemente übersprungen, die nicht alle Schlüssel haben. Wird die Aktion von keinem Ziel
        unterstützt: 422 `unsupported_action`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunRequest' }
      responses:
        '202':
          description: Lauf angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /runs/{run_id}:
    get:
      tags: [actions]
      operationId: getRun
      summary: Lauf mit Kindern (view am Ziel)
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Lauf
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{run_id}/cancel:
    post:
      tags: [actions]
      operationId: cancelRun
      summary: Noch nicht gesendete Läufe abbrechen (wer ihn ausgelöst hat oder operate am Ziel)
      description: |
        Bricht den Lauf und alle Kinder ab, die noch `pending` sind; Gesendetes läuft zu Ende. Bei
        einem Preset-Wurzellauf startet keine weitere Stufe. Ein abgebrochener übergeordneter Lauf
        endet als `cancelled`. Lauf im Endzustand: 409 `run_finished`.
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '204': { description: 'Abgebrochen, soweit möglich' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /presets:
    get:
      tags: [actions]
      operationId: listPresets
      summary: Presets ohne Schritte (preset_run oder preset_edit)
      responses:
        '200':
          description: Presets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PresetSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [actions]
      operationId: createPreset
      summary: Preset anlegen (preset_edit)
      description: Ziele müssen existieren (422 `invalid_target`); `driver` bei `device_level = true` (422 `driver_required`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresetInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /presets/{preset_id}:
    get:
      tags: [actions]
      operationId: getPreset
      summary: Preset mit Schritten (preset_run oder preset_edit)
      parameters:
        - $ref: '#/components/parameters/PresetID'
      responses:
        '200':
          description: Preset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [actions]
      operationId: updatePreset
      summary: Name, Beschreibung und Schritte ersetzen (preset_edit)
      description: Schritte mit bekannter `id` bleiben dieselben Schritte; fehlende werden gelöscht, Schritte ohne `id` neu angelegt.
      parameters:
        - $ref: '#/components/parameters/PresetID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresetInput' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [actions]
      operationId: deletePreset
      summary: Preset löschen (preset_edit); vergangene Läufe bleiben
      parameters:
        - $ref: '#/components/parameters/PresetID'
      responses:
        '204': { description: Gelöscht }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /presets/{preset_id}/run:
    post:
      tags: [actions]
      operationId: runPreset
      summary: Preset starten (preset_run und die Rechte an allen Zielen)
      description: |
        Vorabprüfung aller Schritte; fehlt ein Recht, startet nichts (403 `missing_rights` mit den
        betroffenen Schritten). Asynchron: Die Antwort enthält die ID des Wurzel-Laufs.
      parameters:
        - $ref: '#/components/parameters/PresetID'
      responses:
        '202':
          description: Preset gestartet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Recht preset_run oder Rechte an Zielen fehlen
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemMissingRights' }
        '404': { $ref: '#/components/responses/NotFound' }

  /forward-targets:
    get:
      tags: [admin]
      operationId: listForwardTargets
      summary: Weiterleitungsziele mit letztem Ergebnis (admin)
      responses:
        '200':
          description: Ziele
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ForwardTarget' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createForwardTarget
      summary: Weiterleitungsziel anlegen (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForwardTargetInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForwardTarget' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /forward-targets/{target_id}:
    put:
      tags: [admin]
      operationId: updateForwardTarget
      summary: Weiterleitungsziel ändern (admin)
      parameters:
        - $ref: '#/components/parameters/TargetID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForwardTargetInput' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForwardTarget' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [admin]
      operationId: deleteForwardTarget
      summary: Weiterleitungsziel löschen (admin)
      parameters:
        - $ref: '#/components/parameters/TargetID'
      responses:
        '204': { description: Gelöscht }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /secrets:
    get:
      tags: [admin]
      operationId: listSecrets
      summary: Secrets ohne Wert (admin oder source_edit, zum Zuweisen an Quellen)
      responses:
        '200':
          description: Secrets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Secret' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createSecret
      summary: Secret anlegen (admin); der Wert ist danach nie wieder lesbar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretCreate' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Secret' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /secrets/{secret_id}:
    delete:
      tags: [admin]
      operationId: deleteSecret
      summary: Secret löschen (admin); in Verwendung 409 `secret_in_use`
      parameters:
        - $ref: '#/components/parameters/SecretID'
      responses:
        '204': { description: Gelöscht }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /secrets/{secret_id}/value:
    put:
      tags: [admin]
      operationId: replaceSecretValue
      summary: Wert ersetzen (admin); Quellen mit diesem Secret werden neu gestartet
      parameters:
        - $ref: '#/components/parameters/SecretID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretValue' }
      responses:
        '204': { description: Ersetzt }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Benutzer und Dienstkonten (admin)
      responses:
        '200':
          description: Benutzer
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createUser
      summary: Benutzer oder Dienstkonto anlegen (admin)
      description: Benutzernamen werden kleingeschrieben; vergeben 409 `username_taken`. Dienstkonten haben kein Passwort.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /users/{user_id}:
    put:
      tags: [admin]
      operationId: updateUser
      summary: Anzeigename, E-Mail, Deaktivierung (admin); Deaktivieren beendet alle Sitzungen
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{user_id}/password:
    put:
      tags: [admin]
      operationId: setUserPassword
      summary: Passwort eines Benutzers setzen (admin); beendet seine Sitzungen
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordSet' }
      responses:
        '204': { description: Gesetzt }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /users/{user_id}/totp/reset:
    post:
      tags: [admin]
      operationId: resetUserTOTP
      summary: TOTP eines Benutzers zurücksetzen (admin); bei der nächsten Anmeldung neu einrichten
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '204': { description: Zurückgesetzt }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{user_id}/tokens:
    get:
      tags: [admin]
      operationId: listTokens
      summary: API-Tokens eines Benutzers ohne Wert (admin)
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Token' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [admin]
      operationId: createToken
      summary: API-Token erzeugen (admin); der Klartext wird nur in dieser Antwort gezeigt
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenCreate' }
      responses:
        '201':
          description: Erzeugt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tokens/{token_id}:
    delete:
      tags: [admin]
      operationId: revokeToken
      summary: Token widerrufen (admin); beendet auch seine Kiosk-Sitzungen
      parameters:
        - name: token_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Widerrufen }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /roles:
    get:
      tags: [admin]
      operationId: listRoles
      summary: Rollen mit Rechten und Mitgliedern (admin)
      responses:
        '200':
          description: Rollen
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createRole
      summary: Rolle anlegen (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /roles/{role_id}:
    put:
      tags: [admin]
      operationId: updateRole
      summary: Name, Beschreibung, Kopplung an den IdP (admin)
      parameters:
        - $ref: '#/components/parameters/RoleID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [admin]
      operationId: deleteRole
      summary: Rolle löschen (admin); ihre Rechte und Mitgliedschaften entfallen
      parameters:
        - $ref: '#/components/parameters/RoleID'
      responses:
        '204': { description: Gelöscht }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /roles/{role_id}/grants:
    put:
      tags: [admin]
      operationId: setRoleGrants
      summary: Rechte einer Rolle ersetzen (admin)
      description: preset_run, preset_edit, source_edit und admin nur ohne Geltungsbereich (422 `global_permission`).
      parameters:
        - $ref: '#/components/parameters/RoleID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Grant' }
      responses:
        '204': { description: Ersetzt }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /roles/{role_id}/members:
    put:
      tags: [admin]
      operationId: setRoleMembers
      summary: Mitglieder einer Rolle ersetzen (admin); Mitgliedschaften aus dem IdP bleiben unberührt
      parameters:
        - $ref: '#/components/parameters/RoleID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: string, format: uuid }
      responses:
        '204': { description: Ersetzt }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/password:
    put:
      tags: [self]
      operationId: changeOwnPassword
      summary: Eigenes Passwort ändern; beendet alle anderen eigenen Sitzungen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204': { description: Geändert }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /auth/sessions:
    get:
      tags: [self]
      operationId: listOwnSessions
      summary: Eigene aktive Sitzungen
      responses:
        '200':
          description: Sitzungen
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions/{session_id}:
    delete:
      tags: [self]
      operationId: revokeOwnSession
      summary: Eigene Sitzung beenden (z. B. auf einem vergessenen Rechner)
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Beendet }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /audit:
    get:
      tags: [history]
      operationId: listAudit
      summary: Audit-Einträge (admin)
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: object_type
          in: query
          schema: { type: string }
        - name: object_id
          in: query
          schema: { type: string, format: uuid }
        - name: actor
          in: query
          description: 'User-ID oder `monika` für Einträge ohne Akteur (z. B. Discovery)'
          schema: { type: string }
        - name: verb
          in: query
          schema: { type: string, enum: [create, update, delete, appear, disappear, login, login_failed] }
      responses:
        '200':
          description: Eine Seite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /findings/history:
    get:
      tags: [history]
      operationId: listFindingHistory
      summary: Befunde, aktive und vergangene (nur sichtbare Elemente; zu gelöschten Elementen nur mit view global)
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/ElementFilter'
        - $ref: '#/components/parameters/Recursive'
        - name: code
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { type: string, enum: [info, warning, error] }
        - name: origin
          in: query
          schema: { type: string, enum: [rule, device, system] }
        - name: rule
          in: query
          schema: { type: string, format: uuid }
        - name: state
          in: query
          schema: { type: string, enum: [active, cleared, withdrawn] }
      responses:
        '200':
          description: Eine Seite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /runs/history:
    get:
      tags: [history]
      operationId: listRunHistory
      summary: Läufe, laufende und vergangene (nur sichtbare Ziele, zu gelöschten nur mit view global; Preset-Wurzeln mit preset_run oder preset_edit)
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/ElementFilter'
        - $ref: '#/components/parameters/Recursive'
        - name: status
          in: query
          schema: { type: string, enum: [pending, sent, rejected, failed, accepted, confirmed, unconfirmed, cancelled] }
        - name: action
          in: query
          schema: { type: string }
        - name: preset
          in: query
          schema: { type: string, format: uuid }
        - name: requested_by
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Eine Seite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: monika_session
      description: Sitzung der UI bzw. Kiosk-Sitzung (HttpOnly, Secure, SameSite=Strict)
    bearer:
      type: http
      scheme: bearer
      description: API-Token eines Dienstkontos (`monika_…`)

  parameters:
    ElementID:
      name: element_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceID:
      name: device_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupID:
      name: group_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LinkID:
      name: link_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RuleID:
      name: rule_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunID:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PresetID:
      name: preset_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TargetID:
      name: target_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SecretID:
      name: secret_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoleID:
      name: role_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Before:
      name: before
      in: query
      description: 'Cursor: nur Einträge älter als diese ID (UUIDv7); `next_before` der vorigen Seite'
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    From:
      name: from
      in: query
      description: Beginn des Zeitraums (einschließlich)
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: Ende des Zeitraums (ausschließlich)
      schema: { type: string, format: date-time }
    ElementFilter:
      name: element
      in: query
      schema: { type: string, format: uuid }
    Recursive:
      name: recursive
      in: query
      description: 'mit `element`: auch alle Elemente eines Geräts bzw. Mitglieder einer Gruppe'
      schema: { type: boolean, default: false }

  headers:
    SetSessionCookie:
      description: '`monika_session=…; HttpOnly; Secure; SameSite=Strict; Path=/`'
      schema: { type: string }
    ClearSessionCookie:
      description: Löscht das Sitzungs-Cookie
      schema: { type: string }

  responses:
    SessionCreated:
      description: Angemeldet; Sitzung im Cookie
      headers:
        Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
    Unauthorized:
      description: Nicht angemeldet bzw. Anmeldung fehlgeschlagen
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Sichtbar, aber das Recht fehlt (`forbidden`) bzw. nur lesender Zugang (`read_only`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Widerspricht dem Stand, z. B. `source_exists`, `member_cycle`, `external_id_taken`
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InUse:
      description: Wird noch von Presets verwendet (`device_in_use`, `group_in_use`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemInUse' }
    NotFound:
      description: Unbekannt oder nicht sichtbar
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Inhaltlich ungültig
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Zu viele Fehlversuche; erneut nach Retry-After
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: 'https://monika.invalid/problems/device_in_use' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Stabiler Fehlercode, z. B. `not_found`, `forbidden`, `read_only`, `device_in_use`, `invalid_target`, `watch_limit`
        instance: { type: string }

    ProblemInUse:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [presets]
          properties:
            presets:
              type: array
              description: Presets mit Schritten auf das Objekt (nur die, die der Benutzer sehen darf)
              items: { $ref: '#/components/schemas/PresetRef' }
    PresetRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Driver:
      type: object
      required: [name, config_schema, actions, facts]
      properties:
        name: { type: string, pattern: '^[a-z0-9]+$' }
        config_schema: { type: object, additionalProperties: true, description: 'JSON-Schema für SourceCreate.config' }
        actions:
          type: array
          items: { $ref: '#/components/schemas/ActionDef' }
        facts:
          type: array
          description: Fakt-Katalog des Treibers (Rohwerte); Kern- und bekannte Fakten aus dem Vokabular sind enthalten
          items: { $ref: '#/components/schemas/FactDef' }
    FactDef:
      type: object
      required: [key, type, kind, historized]
      properties:
        key: { type: string, description: '<measurement>.<feld> (Vokabular) bzw. <treiber>.<name> (roh); Einheit als Endung' }
        type: { type: string, enum: [bool, int, float, string] }
        kind: { type: string, enum: [status, gauge, counter] }
        historized: { type: boolean, description: 'geht nach InfluxDB; rohe Fakten nie' }
        description: { type: string, nullable: true }
    ActionDef:
      type: object
      required: [name, critical]
      properties:
        name: { type: string }
        params: { type: object, additionalProperties: true, nullable: true, description: 'JSON-Schema der Parameter' }
        critical: { type: boolean }
        timeout_seconds: { type: number, nullable: true }

    DeviceCreate:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1 }
        notes: { type: string, nullable: true }
    GroupCreate:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1 }
        notes: { type: string, nullable: true }
    UserFields:
      type: object
      required: [label, notes, monitored]
      properties:
        label: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        monitored: { type: boolean }

    Source:
      type: object
      required: [id, device_id, access_element_id, driver, config, enabled]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        access_element_id: { type: string, format: uuid }
        driver: { type: string }
        address: { type: string, nullable: true }
        config: { type: object, additionalProperties: true }
        secret_id: { type: string, format: uuid, nullable: true }
        enabled: { type: boolean }
        identity: { $ref: '#/components/schemas/Identity' }
    Identity:
      type: object
      description: Identität des Geräts aus Sicht dieser Quelle (vom Treiber)
      properties:
        vendor: { type: string, nullable: true }
        model: { type: string, nullable: true }
        serial: { type: string, nullable: true }
        firmware: { type: string, nullable: true }
    SourceCreate:
      type: object
      required: [driver, config, enabled]
      properties:
        driver: { type: string }
        address: { type: string, nullable: true }
        config: { type: object, additionalProperties: true }
        secret_id: { type: string, format: uuid, nullable: true }
        enabled: { type: boolean }
    SourceUpdate:
      type: object
      required: [config, enabled]
      properties:
        address: { type: string, nullable: true }
        config: { type: object, additionalProperties: true }
        secret_id: { type: string, format: uuid, nullable: true }
        enabled: { type: boolean }

    MembershipCreate:
      type: object
      required: [element_id]
      properties:
        element_id: { type: string, format: uuid, description: 'aufzunehmendes Element, Gerät oder Gruppe' }
        position: { type: integer, nullable: true }
        label: { type: string, nullable: true }
    MembershipUpdate:
      type: object
      required: [position, label]
      properties:
        position: { type: integer, nullable: true }
        label: { type: string, nullable: true }

    JSONValue:
      description: beliebiger JSON-Wert (bool, Zahl, String, Liste)
      oneOf:
        - type: boolean
        - type: number
        - type: string
        - type: array
          items: {}
    Condition:
      type: object
      required: [fact, op, value]
      properties:
        fact: { type: string }
        op: { type: string, enum: [eq, ne, lt, lte, gt, gte, in, not_in] }
        value: { $ref: '#/components/schemas/JSONValue' }
    RuleInput:
      type: object
      required: [name, enabled, severity, fact, op, value, hold_seconds]
      properties:
        name: { type: string, minLength: 1 }
        enabled: { type: boolean }
        severity: { type: string, enum: [info, warning, error] }
        scope_element_id: { type: string, format: uuid, nullable: true }
        match_kind: { type: string, nullable: true }
        match_transport: { type: string, nullable: true }
        match_driver: { type: string, nullable: true }
        fact: { type: string }
        op: { type: string, enum: [eq, ne, lt, lte, gt, gte, in, not_in] }
        value: { $ref: '#/components/schemas/JSONValue' }
        when:
          type: object
          nullable: true
          description: 'Vorbedingung; null = gilt immer'
          allOf:
            - $ref: '#/components/schemas/Condition'
        clear_value: { type: number, nullable: true, description: 'Hysterese, nur numerisch' }
        hold_seconds: { type: integer, minimum: 0 }
        clear_hold_seconds: { type: integer, minimum: 0, default: 0, description: 'Sollzustand muss so lange anliegen, bevor der Befund endet' }
    EffectiveRuleSet:
      type: object
      required: [fact, direction, effective, overridden]
      properties:
        fact: { type: string }
        direction: { type: string, enum: [upper, lower, equality] }
        effective:
          type: array
          items: { $ref: '#/components/schemas/RuleRef' }
        overridden:
          type: array
          items: { $ref: '#/components/schemas/RuleRef' }
    RuleRef:
      type: object
      required: [rule_id, scope]
      properties:
        rule_id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, enum: [element, ancestor, device, group, global] }
        scope_element_id: { type: string, format: uuid, nullable: true, description: 'nur, wenn der Benutzer den Geltungsbereich sehen darf' }
        satisfied: { type: boolean, nullable: true, description: 'nur bei geltenden Regeln: aktuell erfüllt' }
    Rule:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - $ref: '#/components/schemas/RuleInput'

    RunRequest:
      type: object
      required: [element_id, action]
      properties:
        element_id: { type: string, format: uuid, description: 'Element, Gerät oder Gruppe' }
        action: { type: string }
        params: { type: object, additionalProperties: true, nullable: true, description: 'bei set die Werte, bei trigger die Parameter' }
        device_level: { type: boolean, default: false, description: 'nur bei Gerät oder Gruppe: true = an die Zugangs-Elemente (das Gerät selbst), false = an alle übrigen Elemente' }
        driver: { type: string, nullable: true, description: 'Filter auf Quellen dieses Treibers; Pflicht bei device_level = true' }
    RunAccepted:
      type: object
      required: [run_id]
      properties:
        run_id: { type: string, format: uuid }
    Run:
      allOf:
        - $ref: '#/components/schemas/RunSummary'
        - type: object
          properties:
            source_id: { type: string, format: uuid, nullable: true }
            preset_step_id: { type: string, format: uuid, nullable: true }
            params: { type: object, additionalProperties: true, nullable: true }
            verify:
              type: object
              nullable: true
              description: eingefrorene Prüfbedingung des Laufs, wie in action_run.verify gespeichert
              required: [timeout_ms, conditions]
              properties:
                timeout_ms: { type: integer }
                conditions:
                  type: array
                  items: { $ref: '#/components/schemas/Condition' }
            response: { type: object, additionalProperties: true, nullable: true }
            sent_at: { type: string, format: date-time, nullable: true }
            responded_at: { type: string, format: date-time, nullable: true }
            children:
              type: array
              items: { $ref: '#/components/schemas/RunSummary' }

    PresetStep:
      type: object
      required: [stage, position, delay_ms, element_id, action, continue_on_error]
      properties:
        id: { type: string, format: uuid, nullable: true, description: 'leer bei neuen Schritten' }
        stage: { type: integer, minimum: 1 }
        position: { type: integer }
        delay_ms: { type: integer, minimum: 0 }
        element_id: { type: string, format: uuid }
        action: { type: string }
        params: { type: object, additionalProperties: true, nullable: true }
        continue_on_error: { type: boolean }
        device_level: { type: boolean, default: false, description: 'wie RunRequest.device_level' }
        driver: { type: string, nullable: true, description: 'Filter auf Quellen dieses Treibers; Pflicht bei device_level = true' }
    PresetInput:
      type: object
      required: [name, steps]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        steps:
          type: array
          items: { $ref: '#/components/schemas/PresetStep' }
    PresetSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        created_by_id: { type: string, format: uuid, nullable: true }
    Preset:
      allOf:
        - $ref: '#/components/schemas/PresetSummary'
        - type: object
          required: [steps]
          properties:
            steps:
              type: array
              items: { $ref: '#/components/schemas/PresetStep' }
    ProblemMissingRights:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [missing]
          properties:
            missing:
              type: array
              items:
                type: object
                required: [permission]
                properties:
                  step_id: { type: string, format: uuid, nullable: true, description: 'leer, wenn preset_run selbst fehlt' }
                  element_id: { type: string, format: uuid, nullable: true }
                  permission: { type: string }

    ForwardTargetInput:
      type: object
      required: [name, kind, enabled, config, events]
      properties:
        name: { type: string, minLength: 1 }
        kind: { type: string, enum: [syslog, webhook] }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true, description: 'syslog: host, port, protocol (udp, tcp, tls), facility; webhook: url, method, headers, body (Vorlage, ohne = Ereignis als JSON). Platzhalter {{secret.<schlüssel>}} nur in url und headers (422 secret_in_body). Format: docs/ARCHITECTURE.md Abschnitt 13' }
        secret_id: { type: string, format: uuid, nullable: true }
        events:
          type: array
          items: { type: string, enum: [finding.raised, finding.cleared, finding.withdrawn, finding.acked, action.finished] }
        min_severity: { type: string, enum: [info, warning, error], nullable: true }
        scope_element_id: { type: string, format: uuid, nullable: true }
    ForwardTarget:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            last_sent_at: { type: string, format: date-time, nullable: true }
            last_error: { type: string, nullable: true }
        - $ref: '#/components/schemas/ForwardTargetInput'

    Secret:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SecretValue:
      type: object
      required: [value]
      properties:
        value:
          type: object
          additionalProperties: true
          description: 'Klartext als JSON, Format legt der Treiber fest, z. B. {"username": "admin", "password": "…"}'
    SecretCreate:
      allOf:
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1 }
            description: { type: string, nullable: true }
        - $ref: '#/components/schemas/SecretValue'

    User:
      type: object
      required: [id, username, service, disabled, totp_enabled, roles, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        service: { type: boolean }
        disabled: { type: boolean }
        totp_enabled: { type: boolean }
        roles:
          type: array
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
    UserCreate:
      type: object
      required: [username, service]
      properties:
        username: { type: string, minLength: 1 }
        display_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        service: { type: boolean }
        password: { type: string, format: password, nullable: true, description: 'Pflicht für Menschen, mindestens 12 Zeichen; leer bei Dienstkonten' }
    UserUpdate:
      type: object
      required: [display_name, email, disabled]
      properties:
        display_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        disabled: { type: boolean }
    PasswordSet:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, minLength: 12 }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 12 }

    Token:
      type: object
      required: [id, user_id, name, read_only, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        read_only: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    TokenCreate:
      type: object
      required: [name, read_only]
      properties:
        name: { type: string, minLength: 1 }
        read_only: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
    TokenCreated:
      allOf:
        - $ref: '#/components/schemas/Token'
        - type: object
          required: [token]
          properties:
            token: { type: string, description: 'monika_…; nur in dieser Antwort sichtbar' }

    RoleInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        external_ref: { type: string, nullable: true, description: 'Wert im Groups-Claim des IdP (später OIDC)' }
    Role:
      allOf:
        - type: object
          required: [id, grants, members]
          properties:
            id: { type: string, format: uuid }
            grants:
              type: array
              items: { $ref: '#/components/schemas/Grant' }
            members:
              type: array
              items: { type: string, format: uuid }
        - $ref: '#/components/schemas/RoleInput'

    SessionInfo:
      type: object
      required: [id, kind, created_at, last_seen_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [user, kiosk] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        user_agent: { type: string, nullable: true }
        remote_addr: { type: string, nullable: true }
        current: { type: boolean, description: 'die Sitzung dieser Anfrage' }

    AuditEntry:
      type: object
      required: [id, at, verb, object_type]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid, nullable: true, description: 'null = Monika selbst' }
        at: { type: string, format: date-time }
        verb: { type: string }
        object_type: { type: string }
        object_id: { type: string, format: uuid, nullable: true }
        before: { type: object, additionalProperties: true, nullable: true }
        after: { type: object, additionalProperties: true, nullable: true }
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        next_before: { type: string, format: uuid, nullable: true, description: 'leer = letzte Seite' }
    FindingPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        next_before: { type: string, format: uuid, nullable: true }
    RunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RunSummary' }
        next_before: { type: string, format: uuid, nullable: true }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginStep:
      type: object
      required: [challenge, needs_enrollment]
      properties:
        challenge: { type: string, description: 'Gültig 5 min, höchstens 5 Versuche' }
        needs_enrollment: { type: boolean }
    ChallengeRequest:
      type: object
      required: [challenge]
      properties:
        challenge: { type: string }
    SecondFactorRequest:
      type: object
      required: [challenge, code]
      properties:
        challenge: { type: string }
        code: { type: string, description: '6-stelliger TOTP-Code oder Wiederherstellungscode' }
    Enrollment:
      type: object
      required: [otpauth_url, secret]
      properties:
        otpauth_url: { type: string }
        secret: { type: string, description: 'Base32, zum Abtippen' }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }
          minItems: 10
          maxItems: 10
    KioskRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, format: password }
    Me:
      type: object
      required: [user_id, username, service, read_only, grants]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        service: { type: boolean }
        read_only: { type: boolean }
        grants:
          type: array
          description: Vereinigung der Rechte aller Rollen, für die UI (Knöpfe ein-/ausblenden)
          items: { $ref: '#/components/schemas/Grant' }
    Grant:
      type: object
      required: [permission]
      properties:
        permission:
          type: string
          enum: [view, acknowledge, operate, configure, critical, inventory_edit, source_edit, rule_edit, preset_run, preset_edit, admin]
        scope_element_id: { type: string, format: uuid, nullable: true }

    State:
      type: object
      description: Sichtbares nach `view`; Vorfahren sichtbarer Elemente getrennt als Gerüst in `skeleton` (ohne Health, Befunde, Fakten); Links nur, wenn beide Enden sichtbar sind
      required: [version, elements, skeleton, links, health, findings, runs, sources]
      properties:
        version: { type: integer, format: int64 }
        elements:
          type: array
          items: { $ref: '#/components/schemas/Element' }
        skeleton:
          type: array
          description: Vorfahren sichtbarer Elemente ohne eigenes view-Recht, nur mit Name und Struktur
          items: { $ref: '#/components/schemas/SkeletonElement' }
        links:
          type: array
          items: { $ref: '#/components/schemas/Link' }
        health:
          type: array
          items: { $ref: '#/components/schemas/ElementHealth' }
        findings:
          type: array
          description: aktive Befunde
          items: { $ref: '#/components/schemas/Finding' }
        runs:
          type: array
          description: laufende Läufe
          items: { $ref: '#/components/schemas/RunSummary' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/SourceStatus' }

    Element:
      type: object
      required: [id, kind, present, monitored, actions, critical_actions]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, description: 'device, group, access, module, port, …' }
        parent_id: { type: string, format: uuid, nullable: true }
        device_id: { type: string, format: uuid, nullable: true }
        source_id: { type: string, format: uuid, nullable: true }
        external_id: { type: string, nullable: true }
        global_ref: { type: string, nullable: true, description: 'mit Namensraum, z. B. xlink:X8A9001-E1; am Zugang die des Geräts' }
        transport: { type: string, nullable: true }
        direction: { type: string, enum: [in, out, bidir], nullable: true }
        name: { type: string, nullable: true }
        label: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        position: { type: integer, nullable: true }
        attributes:
          type: object
          additionalProperties: true
          description: Statische Treiber-Attribute, nur zur Anzeige
        params:
          type: object
          nullable: true
          description: |
            Parameter-Schemas von Aktionen mit eigenem Schema an diesem Element (Sende-Ziele: `trigger`):
            Aktion → Parameter → Param. Die UI baut daraus das Formular.
          additionalProperties:
            type: object
            additionalProperties: { $ref: '#/components/schemas/Param' }
        actions:
          type: array
          items: { type: string }
        critical_actions:
          type: array
          items: { type: string }
        settings:
          type: object
          nullable: true
          description: Schreibbare Fakt-Schlüssel (für `set`); der Schlüssel ist der Fakt-Schlüssel
          additionalProperties: { $ref: '#/components/schemas/Setting' }
        present: { type: boolean }
        monitored: { type: boolean }
        first_seen_at: { type: string, format: date-time, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
    SkeletonElement:
      type: object
      description: Gerüst eines Vorfahren (api.md, Sichtbarkeit); keine Einzelabfrage, keine Aktionen
      required: [id, kind]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        name: { type: string, nullable: true }
        label: { type: string, nullable: true }
        parent_id: { type: string, format: uuid, nullable: true }
        device_id: { type: string, format: uuid, nullable: true }
    Setting:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: 'int, float, bool, string, enum, ipv4, …'
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
        values:
          type: array
          description: erlaubte Werte bei `enum`
          items: { type: string }
        critical: { type: boolean, description: 'Ändern erfordert zusätzlich das Recht critical' }
        write_only: { type: boolean, description: 'Gerät meldet den Wert nicht zurück: kein Fakt, keine Prüfung, Endzustand accepted' }
    Param:
      description: Parameter eines Sende-Ziel-Aufrufs; wie Setting, zusätzlich mit Standardwert
      allOf:
        - $ref: '#/components/schemas/Setting'
        - type: object
          properties:
            default:
              oneOf:
                - type: boolean
                - type: number
                - type: string
    Link:
      type: object
      required: [id, type]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [feeds, uses, member, represents] }
        source_id: { type: string, format: uuid, nullable: true }
        from_id: { type: string, format: uuid, nullable: true }
        from_ref: { type: string, nullable: true }
        to_id: { type: string, format: uuid, nullable: true }
        to_ref: { type: string, nullable: true }
        position: { type: integer, nullable: true }
        label: { type: string, nullable: true }
    ElementHealth:
      type: object
      required: [element_id]
      properties:
        element_id: { type: string, format: uuid }
        health:
          type: string
          enum: [ok, warning, error, unknown]
          nullable: true
          description: null = keine Health (nicht überwacht, verschwunden oder ungeprüft; bei Gerät und Gruppe auch leere Menge)
        rollup: { $ref: '#/components/schemas/Rollup' }
    Rollup:
      type: object
      nullable: true
      required: [ok, warning, error, unknown, unchecked, unmonitored, missing]
      properties:
        ok: { type: integer }
        warning: { type: integer }
        error: { type: integer }
        unknown: { type: integer }
        unchecked: { type: integer, description: 'ohne geltende Regel' }
        unmonitored: { type: integer }
        missing: { type: integer }
    Finding:
      type: object
      required: [id, element_id, element_path, origin, code, severity, raised_at]
      properties:
        id: { type: string, format: uuid }
        element_id: { type: string, format: uuid }
        element_path: { type: string, description: 'Anzeigename des Elements beim Entstehen' }
        element_deleted: { type: boolean, description: 'nur im Verlauf: das Element existiert nicht mehr' }
        origin: { type: string, enum: [rule, device, system] }
        rule_id: { type: string, format: uuid, nullable: true }
        code: { type: string }
        severity: { type: string, enum: [info, warning, error] }
        message: { type: string, nullable: true }
        details: { type: object, additionalProperties: true, nullable: true }
        caused_by_id: { type: string, format: uuid, nullable: true, description: 'Wurzel-Ursache; null = selbst Ursache' }
        raised_at: { type: string, format: date-time }
        cleared_at: { type: string, format: date-time, nullable: true }
        acked_at: { type: string, format: date-time, nullable: true }
        acked_by_id: { type: string, format: uuid, nullable: true }
    RunSummary:
      type: object
      required: [id, action, status, requested_by_id, requested_at]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        preset_id: { type: string, format: uuid, nullable: true }
        element_id: { type: string, format: uuid, nullable: true }
        element_path: { type: string, nullable: true, description: 'Anzeigename des Ziels beim Anlegen' }
        element_deleted: { type: boolean, description: 'nur im Verlauf: das Ziel existiert nicht mehr' }
        action: { type: string }
        status: { type: string, enum: [pending, sent, rejected, failed, accepted, confirmed, unconfirmed, cancelled] }
        critical: { type: boolean }
        requested_by_id: { type: string, format: uuid }
        requested_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    SourceStatus:
      type: object
      required: [source_id, state]
      properties:
        source_id: { type: string, format: uuid }
        state: { type: string, enum: [starting, connecting, live, unreachable, backoff, stopping, stuck, disabled], description: 'nur live wird bewertet' }
        heartbeat_seconds: { type: number, nullable: true, description: 'erwarteter Abstand der Lebenszeichen der laufenden Instanz; 0 = keine Überwachung' }
        since: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }

    Facts:
      type: object
      description: 'Fakten eines Elements, Schlüssel <measurement>.<feld> bzw. <treiber>.<name>; Werte sind bool, Zahl oder String. Ob eine Zahl int oder float ist, sagt der Fakt-Katalog (GET /drivers); Ganzzahlen über 2^53 kann JavaScript nicht exakt darstellen'
      additionalProperties:
        oneOf:
          - type: boolean
          - type: number
          - type: string
    ElementFacts:
      type: object
      required: [version, element_id, facts]
      properties:
        version: { type: integer, format: int64 }
        element_id: { type: string, format: uuid }
        facts: { $ref: '#/components/schemas/Facts' }

    WatchRequest:
      type: object
      properties:
        add:
          type: array
          description: Elemente, Geräte oder Gruppen
          items: { type: string, format: uuid }
        remove:
          type: array
          items: { type: string, format: uuid }
    WatchResponse:
      type: object
      required: [version, watched, facts]
      properties:
        version: { type: integer, format: int64 }
        watched: { type: integer, description: 'Anzahl beobachteter Elemente nach der Änderung' }
        facts:
          type: array
          items: { $ref: '#/components/schemas/ElementFacts' }

    EventHello:
      type: object
      required: [stream_id, version]
      properties:
        stream_id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
    EventElementsChanged:
      type: object
      required: [elements, skeleton, removed_elements, removed_links, links]
      properties:
        elements:
          type: array
          items: { $ref: '#/components/schemas/Element' }
        skeleton:
          type: array
          description: neue oder geänderte Gerüst-Elemente
          items: { $ref: '#/components/schemas/SkeletonElement' }
        removed_elements:
          type: array
          description: gelöschte Elemente (Gerät, Quelle oder Gruppe gelöscht)
          items: { type: string, format: uuid }
        links:
          type: array
          items: { $ref: '#/components/schemas/Link' }
        removed_links:
          type: array
          items: { type: string, format: uuid }
    EventFactsChanged:
      type: object
      required: [element_id, facts]
      properties:
        element_id: { type: string, format: uuid }
        facts:
          $ref: '#/components/schemas/Facts'
        removed:
          type: array
          description: Schlüssel, die es nicht mehr gibt
          items: { type: string }
    EventHealthChanged:
      type: object
      required: [health]
      properties:
        health:
          type: array
          items: { $ref: '#/components/schemas/ElementHealth' }
    EventFindingEnded:
      type: object
      required: [finding_id, cleared_at, reason, withdrawn]
      properties:
        finding_id: { type: string, format: uuid }
        cleared_at: { type: string, format: date-time }
        reason: { type: string, enum: [resolved, rule_deleted, rule_disabled, rule_changed, unmonitored, element_missing, fact_missing, source_disabled, deleted] }
        withdrawn: { type: boolean }
    EventFindingCauseChanged:
      type: object
      required: [finding_id]
      properties:
        finding_id: { type: string, format: uuid }
        caused_by_id: { type: string, format: uuid, nullable: true, description: 'neue Wurzel-Ursache; null = selbst Ursache' }
