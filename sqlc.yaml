# sqlc: erzeugt typsicheren Go-Code aus den Migrationen (Schema) und den Queries.
# Ausführen mit `make db-gen-go`.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/store/postgres/queries
    gen:
      go:
        package: db
        out: internal/store/postgres/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
